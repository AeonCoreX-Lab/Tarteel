name: Upstream sync (Mihrab)

# Weekly: look at the latest upstream commit and, if the files we vendor changed,
# open a pull request with a reviewable diff. Nothing is ever merged automatically.
# No fork is needed: we only read the public repo.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      accept_license_change:
        description: "Set only after you read the new upstream licence files"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch upstream (shallow)
        run: |
          REPO=$(node -p "require('./upstream.config.json').mihrab.repo")
          BRANCH=$(node -p "require('./upstream.config.json').mihrab.branch")
          git clone --depth 1 --branch "$BRANCH" "$REPO" "$RUNNER_TEMP/upstream"
          echo "UP_SHA=$(git -C "$RUNNER_TEMP/upstream" rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: What would change?
        id: diff
        run: |
          set +e
          changed=false
          : > "$RUNNER_TEMP/diff.json"
          for n in $(node -p "Object.keys(require('./upstream.config.json')).join(' ')"); do
            node --no-warnings scripts/upstream/cli.ts diff --name "$n" --from "$RUNNER_TEMP/upstream" > "$RUNNER_TEMP/diff-$n.json"
            code=$?
            echo "== $n (exit $code)" | tee -a "$RUNNER_TEMP/diff.json"
            cat "$RUNNER_TEMP/diff-$n.json" | tee -a "$RUNNER_TEMP/diff.json"
            # exit 2 = differences, 0 = none; anything else is a real failure
            if [ "$code" = 2 ]; then changed=true; elif [ "$code" != 0 ]; then exit 1; fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Sync
        if: steps.diff.outputs.changed == 'true'
        run: |
          EXTRA=""
          if [ "${{ inputs.accept_license_change }}" = "true" ]; then EXTRA="--accept-license-change"; fi
          for n in $(node -p "Object.keys(require('./upstream.config.json')).join(' ')"); do
            node --no-warnings scripts/upstream/cli.ts sync --name "$n" --from "$RUNNER_TEMP/upstream" --sha "$UP_SHA" $EXTRA
          done

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BR="upstream/mihrab-${UP_SHA:0:8}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add third_party
          git commit -m "chore(upstream): sync Mihrab @ ${UP_SHA:0:8}"
          git push -u origin "$BR"
          {
            echo "Automated sync of vendored Mihrab files to \`$UP_SHA\`."
            echo
            echo "Review checklist:"
            echo "- [ ] \`licenseChanged\` below is empty (otherwise read the new licence before merging)"
            echo "- [ ] \`externalChanged\` dependency bumps are compatible (adhan, react-native, i18next)"
            echo "- [ ] \`npm run check\` passes (the CANARY test may legitimately flip if upstream fixed the bug)"
            echo
            echo '```json'
            cat "$RUNNER_TEMP/diff.json"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          gh pr create --title "Upstream sync: Mihrab @ ${UP_SHA:0:8}" --body-file "$RUNNER_TEMP/body.md" --base "${{ github.event.repository.default_branch }}"
