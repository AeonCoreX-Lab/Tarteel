name: Android build

on:
  workflow_dispatch:
    inputs:
      abis:
        description: "ABIs to build"
        default: "arm64-v8a,armeabi-v7a"
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Job-level env may read secrets; step-level `if` may not, so the check goes through this flag.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Require bootstrapped dependencies
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json is missing. It is created automatically when you push (workflow 'Bootstrap dependencies'); open that workflow in the Actions tab, check its last run, or run it manually, then try again."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci

      - name: Quality gates (same as CI)
        run: |
          npm run typecheck
          npm test
          npm run validate:quran
          npm run validate:translations

      - name: Build content database into the app assets
        run: npm run build:db

      - name: Generate native Android project
        working-directory: apps/mobile
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=${{ inputs.abis || 'arm64-v8a,armeabi-v7a' }}

      - name: Locate APK
        id: apk
        run: |
          APK=$(find apps/mobile/android/app/build/outputs/apk/release -name '*.apk' | head -n1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      # Optional: sign with your release key if these repository secrets exist.
      # Without them the APK is signed with the default debug key (fine for testing, NOT for store release).
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Sign with release key
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS "${{ steps.apk.outputs.path }}"
          "$BT/apksigner" verify "${{ steps.apk.outputs.path }}"
          rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: tarteel-android-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
