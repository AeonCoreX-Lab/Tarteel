name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Mihrab-derived code verify
        run: npm run upstream:verify

  data:
    name: Validate Quran and translation data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies without scripts
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            npm install --ignore-scripts
          fi
      - name: Validate Quran dataset
        run: npm run validate:quran -- --allow-empty
      - name: Validate translations
        run: npm run validate:translations
      - name: Validate audio
        run: npm run validate:audio
      - name: Build content database
        run: |
          HAS_DATA=$(find data/quran -mindepth 1 -maxdepth 1 -type d 2>/dev/null || true)
          if [ -n "$HAS_DATA" ]; then
            npm run build:db -- --out build/db
          else
            echo "No Quran dataset yet: building schema-only database."
            npm run build:db -- --out build/db --empty
          fi
      - name: Validate knowledge tables
        run: npm run validate:knowledge -- build/db/quran.db
      - name: Build knowledge packs
        run: npm run build:pack -- --quran build/db/quran.db --out build/packs

  mobile-types:
    name: Mobile typecheck (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Typecheck Mobile App
        run: npx tsc -p apps/mobile --noEmit
