# Tarteel translation Worker. See README.md for the one-time setup (about ten minutes; the free plan is enough).
name = "tarteel-translate"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# Workers AI. The binding is the permission: there is no API key to keep secret, and nothing in the app to extract.
[ai]
binding = "AI"

# The shared translation cache. Create it once (dashboard -> Storage & databases -> KV -> Create) and paste the id here.
[[kv_namespaces]]
binding = "TRANSLATE_CACHE"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[vars]
TRANSLATE_ENABLED = "true"
# Any Workers AI chat model. Changing it starts a fresh cache (the model is part of the cache key).
TRANSLATE_MODEL = "@cf/google/gemma-3-12b-it"
# Raise (p2, p3 ...) after improving the prompt, so older cached answers are no longer used.
PROMPT_VERSION = "p1"
# What GET /config tells the app. Leave empty to mean this Worker's own address; set it if the Worker ever moves.
CURRENT_TRANSLATE_URL = ""

# Logs only count translations (cache hit or miss, language, length). They never hold the text or the caller's address.
[observability]
enabled = true
