apply plugin: "com.android.library"
apply plugin: "kotlin-android"

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

// The Kotlin sources are Mihrab's, vendored byte-for-byte and hash-locked in third_party/mihrab-android
// (see docs/upstream/README.md). They live in the package `com.prayer_times`, so this library's
// namespace must be the same: it makes the generated `R` class match their `R.drawable.*` references.
// The app's own applicationId is unrelated to this namespace.
def vendored = "${projectDir}/../../../third_party/mihrab-android/files/android/app/src/main"

android {
  namespace "com.prayer_times"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  sourceSets {
    main {
      java.srcDirs += ["${vendored}/java"]
    }
  }
}

dependencies {
  // Version is supplied by the React Native Gradle plugin of the host app.
  implementation "com.facebook.react:react-android"
  implementation "androidx.core:core-ktx:1.13.1"
}
